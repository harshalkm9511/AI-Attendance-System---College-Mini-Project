services:
  - type: web
    name: ai-attendance-system
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 run:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_TENANT_NAME
        value: Demo Institute
      - key: DEFAULT_TENANT_CODE
        value: demo-institute
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      - key: DATA_DIR
        value: /var/data/attendance
      - key: DATABASE_PATH
        value: /var/data/attendance/instance/attendance.sqlite3
      - key: STORAGE_DIR
        value: /var/data/attendance/storage
    disks:
      - name: attendance-data
        mountPath: /var/data
        sizeGB: 1
